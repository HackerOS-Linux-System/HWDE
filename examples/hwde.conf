#!/usr/bin/hl
using <gen 2>

;; ===========================================================================
;; Przyklad ~/.config/hwde/hwde.conf (HWDE 0.2) - konfiguracja w Hacker Langu.
;; Skopiuj fragmenty do swojego pliku, POD blokiem hwde-settings (jesli jest).
;; Ustawienia to zmienne `sekcja_klucz`; wszystko, co nie jest ustawione, ma
;; wartosc domyslna. Pelna lista kluczy: docs/CONFIG.md
;; ===========================================================================

;; ---- zwykle przypisania ----------------------------------------------------
% appearance_mode: str = "dark"
% appearance_accent: str = "#8b5cf6"
% panel_position: str = "top"
% panel_height: int = 40
% panel_right: str = "status,clock,power"
% apps_terminal: str = "foot"

;; ---- skroty: keys_<KLAWISZ> (myslnik w nazwie klawisza = "_") ---------------
;; W-t -> keys_W_t ,  XF86AudioMute -> keys_XF86AudioMute ,  KP_Enter -> keys_KP__Enter
% keys_W_t: str = "exec:hwde run terminal"
% keys_W_w: str = "exec:hwde wallpaper next"
% keys_W_S_s: str = "exec:hwde run screenshot"
% keys_W_q: str = ""

;; ---- autostart: autostart_a001, a002... (kolejnosc alfabetyczna) -------------
% autostart_a001: str = "nm-applet --indicator"
% autostart_a002: str = "sh -c 'sleep 2 && firefox'"

;; ---- monitory: NAZWA:SKALA oddzielone spacjami -------------------------------
% display_scale: str = "eDP-1:1.5 HDMI-A-1:1"

;; ---- tapety ------------------------------------------------------------------
% wallpaper_mode: str = "slideshow"
% wallpaper_folder: str = "~/Pictures/Wallpapers"
% wallpaper_interval: int = 10
% wallpaper_order: str = "random"
% wallpaper_fit: str = "fill"
;; osobny obraz dla ciemnego i jasnego motywu:
;;   % wallpaper_mode: str = "image"
;;   % wallpaper_image_dark: str = "~/Pictures/noc.png"
;;   % wallpaper_image_light: str = "~/Pictures/dzien.png"
;; tapeta per monitor: NAZWA=PLIK oddzielone srednikami
% wallpaper_outputs: str = "HDMI-A-1=~/Pictures/monitor2.png"

;; ---- nocne swiatlo (wlsunset) -------------------------------------------------
% night_enabled: int = 1
% night_temp: int = 3800
% night_start: str = "21:00"
% night_end: str = "06:30"

;; ---- logika: prawdziwy kod Hacker Langa ----------------------------------------
;; rozne ustawienia zaleznie od komputera:
> hostname |> @host
? switch @host
| laptop
    % panel_height: int = 44
    % input_tap: int = 1
    % lock_timeout: int = 5
| *
    % lock_timeout: int = 15
done

;; zmienne srodowiskowe i obliczenia:
::env HOME |> @home
::set wallpaper_image @home/Pictures/tapeta.png

;; wynik komendy jako wartosc:
>> test -f /sys/class/power_supply/BAT0/capacity
? ok
    % panel_right: str = "status,clock,power"
done
